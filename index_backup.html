<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Times</title>
  <link rel="stylesheet" href="https://use.typekit.net/trw5kij.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: "logic-monospace", "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.6;
      padding: 20px;
    }

    .date-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .date {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      user-select: none;
      display: inline-block;
    }

    .date:hover {
      opacity: 0.6;
    }

    /* 미니멀 흑백 달력 팝오버 */
    .calendar-popover {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: #ffffff;
      border: 1px solid #000000;
      padding: 12px 14px;
      z-index: 100;
      width: 220px;
      user-select: none;
    }

    .calendar-popover.active {
      display: block;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .calendar-nav-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      color: #000000;
    }

    .calendar-nav-btn:hover {
      opacity: 0.5;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 13px;
    }

    .calendar-day-name {
      font-weight: 400;
      color: #888888;
      padding-bottom: 4px;
    }

    .calendar-cell {
      padding: 3px 0;
      cursor: pointer;
    }

    .calendar-cell:hover:not(.empty) {
      background-color: #000000;
      color: #ffffff;
    }

    .calendar-cell.selected {
      background-color: #000000;
      color: #ffffff;
    }

    .calendar-cell.today:not(.selected) {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .calendar-cell.empty {
      cursor: default;
    }

    ul {
      list-style-type: none;
    }

    li {
      margin-bottom: 8px;
      white-space: pre;
    }
  </style>
</head>
<body>

  <div class="date-wrapper">
    <div id="date" class="date" title="클릭하여 날짜 선택">----.--.--</div>
    <div id="calendar" class="calendar-popover">
      <div class="calendar-header">
        <button id="prev-month" class="calendar-nav-btn" aria-label="이전 달">&lt;</button>
        <span id="calendar-month-year">2026.10</span>
        <button id="next-month" class="calendar-nav-btn" aria-label="다음 달">&gt;</button>
      </div>
      <div class="calendar-grid" id="calendar-days">
        <!-- JS 생성 -->
      </div>
    </div>
  </div>

  <ul id="schedule">
    <li>loading...</li>
  </ul>

  <script>
    // 현재 선택된 날짜 (기본값: 오늘)
    let currentDate = new Date();
    // 달력 뷰용 년/월
    let viewYear = currentDate.getFullYear();
    let viewMonth = currentDate.getMonth();

    // 날짜 기반 시드 생성을 위한 32비트 해시 함수 (cyrb128)
    function cyrb128(str) {
      let h1 = 1779033703, h2 = 3144134277,
          h3 = 1013904242, h4 = 2773480762;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = h2 ^ Math.imul(h1 ^ ch, 597399067);
        h2 = h3 ^ Math.imul(h2 ^ ch, 2869860223);
        h3 = h4 ^ Math.imul(h3 ^ ch, 951274213);
        h4 = h1 ^ Math.imul(h4 ^ ch, 2716044179);
      }
      h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
      h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860223);
      h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
      h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
      return [(h1^h2^h3^h4)>>>0, (h2^h1)>>>0, (h3^h1)>>>0, (h4^h1)>>>0];
    }

    // 시드 기반 0~1 사이 Pseudo-Random 생성기 (Mulberry32)
    function mulberry32(a) {
      return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
    }

    // 특정 날짜의 스케줄 데이터 계산 (결정론적 난수)
    function getScheduleForDate(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dayName = days[dateObj.getDay()];
      
      const dateStr = `${year}.${month}.${day}(${dayName})`;
      const seedKey = `${year}${month}${day}`;

      // 날짜 문자열로 시드 난수 생성기 초기화
      const seed = cyrb128(seedKey);
      const rand = mulberry32(seed[0]);

      // 명단 설정 (총 5명)
      const people = ["호준", "명선", "찬혁", "민욱", "주희"];

      // 09:00 (540분) ~ 24:00 (1440분) 범위 중 중복 없이 인원수만큼 선택
      const startMin = 9 * 60; // 540
      const endMin = 24 * 60;  // 1440
      const range = endMin - startMin; // 900분

      const selectedMinutes = [];
      while (selectedMinutes.length < people.length) {
        const picked = startMin + Math.floor(rand() * range);
        if (!selectedMinutes.includes(picked)) {
          selectedMinutes.push(picked);
        }
      }

      // 오름차순 정렬 (시간순)
      selectedMinutes.sort((a, b) => a - b);

      // 명단 셔플 (Fisher-Yates Shuffle with PRNG)
      for (let i = people.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [people[i], people[j]] = [people[j], people[i]];
      }

      // 시간 포맷 변환 및 매핑 (HH:MM)
      const schedule = selectedMinutes.map((min, idx) => {
        const h = String(Math.floor(min / 60)).padStart(2, '0');
        const m = String(min % 60).padStart(2, '0');
        return {
          time: `${h}:${m}`,
          person: people[idx]
        };
      });

      return { dateStr, schedule };
    }

    // 화면 렌더링
    function render(dateObj) {
      const { dateStr, schedule } = getScheduleForDate(dateObj);
      
      document.getElementById('date').innerText = dateStr;
      
      const listEl = document.getElementById('schedule');
      listEl.innerHTML = '';
      
      schedule.forEach(item => {
        const li = document.createElement('li');
        li.innerText = `${item.time} - ${item.person}`;
        listEl.appendChild(li);
      });
    }

    // 미니 달력 렌더링
    function renderCalendar() {
      const monthYearEl = document.getElementById('calendar-month-year');
      const daysEl = document.getElementById('calendar-days');
      
      const displayMonth = String(viewMonth + 1).padStart(2, '0');
      monthYearEl.innerText = `${viewYear}.${displayMonth}`;
      
      daysEl.innerHTML = '';

      const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
      dayNames.forEach(name => {
        const nameEl = document.createElement('div');
        nameEl.className = 'calendar-day-name';
        nameEl.innerText = name;
        daysEl.appendChild(nameEl);
      });

      // 이번 달 첫째 날의 요일과 마지막 날짜
      const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

      // 시작 요일 전 빈 칸
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-cell empty';
        daysEl.appendChild(emptyCell);
      }

      const today = new Date();

      // 날짜 숫자 채우기
      for (let d = 1; d <= lastDate; d++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-cell';
        cell.innerText = d;

        const isSelected = 
          currentDate.getFullYear() === viewYear &&
          currentDate.getMonth() === viewMonth &&
          currentDate.getDate() === d;

        const isToday = 
          today.getFullYear() === viewYear &&
          today.getMonth() === viewMonth &&
          today.getDate() === d;

        if (isSelected) cell.classList.add('selected');
        if (isToday) cell.classList.add('today');

        cell.addEventListener('click', (e) => {
          e.stopPropagation();
          currentDate = new Date(viewYear, viewMonth, d);
          render(currentDate);
          renderCalendar();
          document.getElementById('calendar').classList.remove('active');
        });

        daysEl.appendChild(cell);
      }
    }

    // 이벤트 리스너 등록
    function initEvents() {
      const dateEl = document.getElementById('date');
      const calendarEl = document.getElementById('calendar');
      const prevBtn = document.getElementById('prev-month');
      const nextBtn = document.getElementById('next-month');

      // 날짜 텍스트 클릭 시 달력 열기/닫기
      dateEl.addEventListener('click', (e) => {
        e.stopPropagation();
        viewYear = currentDate.getFullYear();
        viewMonth = currentDate.getMonth();
        renderCalendar();
        calendarEl.classList.toggle('active');
      });

      // 달력 내부 클릭 시 닫히지 않도록 이벤트 전파 중단
      calendarEl.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      // < 이전 달 이동
      prevBtn.addEventListener('click', () => {
        viewMonth--;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear--;
        }
        renderCalendar();
      });

      // > 다음 달 이동
      nextBtn.addEventListener('click', () => {
        viewMonth++;
        if (viewMonth > 11) {
          viewMonth = 0;
          viewYear++;
        }
        renderCalendar();
      });

      // 달력 외부 클릭 시 닫기
      document.addEventListener('click', () => {
        calendarEl.classList.remove('active');
      });
    }

    window.onload = () => {
      initEvents();
      render(currentDate);
    };
  </script>
</body>
</html>
